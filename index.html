<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AirWatch — Smart Air Quality Monitoring System</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<!-- LOGIN / REGISTER -->
<section id="auth">
  <button class="moon icon" aria-label="Toggle theme">🌙</button>
  <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
  <div class="auth">
    <div class="logo-tile">
      <svg viewBox="0 0 100 100" width="76" height="76" aria-hidden="true">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f7bff"/><stop offset="1" stop-color="#1636c9"/></linearGradient>
          <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fa2ff"/><stop offset="1" stop-color="#2a56e6"/></linearGradient>
          <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b9c8f5"/></linearGradient>
        </defs>
        <path d="M16 64C16 49 31 41 44 38 36 49 38 62 47 72 33 78 17 76 16 64z" fill="url(#g1)"/>
        <path d="M31 47C33 32 50 24 63 21 54 34 56 49 67 60 52 66 33 64 31 47z" fill="url(#g2)"/>
        <path d="M52 28C54 16 66 8 77 7 70 18 74 30 83 38 70 45 54 41 52 28z" fill="url(#g3)"/>
      </svg>
    </div>
    <h1>Welcome Back</h1>
    <p class="sub">Sign in to continue</p>
    <div class="tabs"><button data-r="user" class="on">User</button><button data-r="admin">Admin</button></div>

    <form id="lf">
      <div class="field">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        <input name="u" placeholder="Username or Email" required autocomplete="username">
      </div>
      <div class="field">
        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
        <input name="p" id="pw" type="password" placeholder="Password" required autocomplete="current-password">
        <button type="button" class="eye" id="eye" aria-label="Show or hide password">👁</button>
      </div>
      <div class="row">
        <label class="chk"><input type="checkbox" id="rm" checked><span>Remember Me</span></label>
        <a id="fp">Forgot Password?</a>
      </div>
      <button class="btn login"><span id="lbt">Login</span><i class="arr">→</i></button>
    </form>

    <form id="rf" hidden>
      <div class="field"><input name="u" placeholder="Username" required minlength="3"></div>
      <div class="field"><input name="e" type="email" placeholder="Email" required></div>
      <div class="field"><input name="p" type="password" placeholder="Password (min 8 characters)" required minlength="8"></div>
      <button class="btn login"><span>Create account</span><i class="arr">→</i></button>
    </form>

    <p id="sw" class="mut sw"></p>
    <p id="err" class="err"></p>
    <p id="hint" class="hint"></p>
    <p class="tag">AIRWATCH • MONITOR • ANALYSE • BREATHE</p>
  </div>
</section>

<!-- APP -->
<div id="app" hidden>
  <aside id="side">
    <div class="logo">🌬️ AirWatch</div>
    <nav class="nav">
      <a data-v="dashboard">📊 Dashboard</a>
      <a data-v="sensors">📡 Sensors</a>
      <a data-v="readings">🧪 Readings</a>
      <a data-v="charts">📈 Charts</a>
      <a data-v="reports">🗂️ Reports</a>
      <a data-v="alerts">🚨 Alerts</a>
      <a data-v="docs">📘 Documentation</a>
    </nav>
    <button class="btn out" id="logout">Logout</button>
  </aside>
  <main>
    <header>
      <button id="burger" aria-label="Menu">☰</button>
      <h2 id="title"></h2>
      <button class="moon icon" aria-label="Toggle theme">🌙</button>
      <span id="who" class="pill"></span>
    </header>
    <div id="view"></div>
  </main>
</div>

<div id="modal" hidden><div class="card"><h3 id="mt"></h3><form id="mf"></form></div></div>
<div id="toast"></div>
<script src="script.js"></script>
</body>
</html>
